[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honchobench"
version = "0.1.0"
description = "Standalone benchmark harness for the 7 honcho roles"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
honchobench = "honchobench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
